[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
lifecycle = "2.11.0"
retrofit = "3.0.0"
coroutines = "1.11.0"

[libraries]
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
androidx-core = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-activity = { module = "androidx.activity:activity-ktx", version = "1.13.0" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
material = { module = "com.google.android.material:material", version = "1.14.0" }
maps = { module = "com.google.android.gms:play-services-maps", version = "20.1.0" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
gson = { module = "com.google.code.gson:gson", version = "2.15.0" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version = "5.5.1" }
glide = { module = "com.github.bumptech.glide:glide", version = "5.0.9" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
ktlint = { module = "com.pinterest.ktlint:ktlint-cli", version = "1.8.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
